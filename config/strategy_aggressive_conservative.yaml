# Conservative Aggressive Market Making Strategy Configuration
# ============================================================
# This configuration optimizes for positive PnL by:
# 1. Wider spreads to reduce adverse selection
# 2. More conservative risk management
# 3. Better inventory control

strategy:
  name: "aggressive_mm_conservative"
  description: "Conservative Aggressive Market Making - Optimized for Positive PnL"
  
  # Core Parameters - More Conservative
  parameters:
    gamma_base: 0.08          # Increased from 0.05 (more risk averse)
    k_base: 2.0               # Increased from 1.5 (wider spreads)
    
    # Alpha Weights - Less Trust in Signals
    micro_weight: 0.3         # Increased from 0.2
    mlofi_weight: 0.6         # Decreased from 0.8 (less trust in OFI)
    slope_weight: 0.0          # Disabled
    
    # Multi-level Depth
    num_levels: 5
    ofi_decay: 0.7
    
    # Volatility Calculation
    window_size: 500
    base_volatility_mult: 5
    vol_smoothing: 0.1
    
    # Order Management - More Conservative
    order_qty: 0.8            # Decreased from 1.0
    max_position: 8.0         # Decreased from 10.0
    
    # Timing
    elapse_interval_ns: 100_000_000
  
  # Regime-specific Parameters - More Conservative Spreads
  regime:
    calm:
      spread_mult: 1.1        # Increased from 1.0
      alpha_mult: 0.9         # Decreased from 1.0
      gamma_mult: 1.0
      vol_threshold: 1.0
    
    active:
      spread_mult: 1.2        # Increased from 0.95
      alpha_mult: 1.1         # Decreased from 1.2
      gamma_mult: 1.0
      vol_threshold: 2.0
    
    volatile:
      spread_mult: 1.5        # Increased from 1.1 (much wider in volatility)
      alpha_mult: 1.2         # Decreased from 1.5
      gamma_mult: 1.3         # Increased from 1.2 (more risk averse)
      vol_threshold: 999.0

  # Alpha Boost - More Conservative
  alpha_boost:
    enabled: true
    extreme_threshold: 1.5
    extreme_mult: 1.5         # Decreased from 2.0
    high_threshold: 1.0
    high_mult: 1.3            # Decreased from 1.5

  # Asymmetric "Hunt" Logic - Less Aggressive
  hunt_logic:
    enabled: true
    bullish_threshold: 0.5
    bearish_threshold: -0.5
    bid_tighten_mult: 0.85   # Less aggressive (was 0.8)
    ask_widen_mult: 1.15      # Less aggressive (was 1.2)
    bid_widen_mult: 1.15      # Less aggressive (was 1.2)
    ask_tighten_mult: 0.85    # Less aggressive (was 0.8)

  # Slope Adjustment
  slope_adjustment:
    enabled: true
    min_mult: 0.85            # More conservative
    max_mult: 1.15            # More conservative

backtest:
  tick_size: 0.1
  lot_size: 0.001
  contract_size: 1.0
  order_latency_ns: 10_000_000
  initial_capital: 30000.0
  queue_model: "power_prob"
  queue_model_param: 2.0
  partial_fill: false

logging:
  level: "INFO"
  file: "logs/backtest.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

