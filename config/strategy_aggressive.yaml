# Aggressive Market Making Strategy Configuration
# ===============================================

strategy:
  name: "aggressive_mm"
  description: "Aggressive Market Making with Multi-Level Order Flow Imbalance"
  
  # Core Parameters
  parameters:
    gamma_base: 0.05          # Risk aversion (lower = more aggressive)
    k_base: 1.5               # Spread parameter
    
    # Alpha Weights
    micro_weight: 0.2         # Micro price weight
    mlofi_weight: 0.8         # Multi-level OFI weight (primary predictor)
    slope_weight: 0.0          # LOB slope weight (disabled - causes double penalty)
    
    # Multi-level Depth
    num_levels: 5              # Number of order book levels
    ofi_decay: 0.7            # Decay factor for level weights
    
    # Volatility Calculation
    window_size: 500          # Price buffer size for volatility
    base_volatility_mult: 5   # Base volatility multiplier (tick_size * mult)
    vol_smoothing: 0.1        # EWMA smoothing factor
    
    # Order Management
    order_qty: 1.0            # Order quantity
    max_position: 10.0        # Maximum position (never reduced)
    
    # Timing
    elapse_interval_ns: 100_000_000  # 100ms between strategy updates
  
  # Regime-specific Parameters
  regime:
    calm:
      spread_mult: 1.0        # Spread multiplier
      alpha_mult: 1.0         # Alpha signal multiplier
      gamma_mult: 1.0         # Gamma multiplier
      vol_threshold: 1.0      # Volatility ratio threshold
    
    active:
      spread_mult: 0.95       # Slightly tighter spreads
      alpha_mult: 1.2         # Trust alpha more
      gamma_mult: 1.0
      vol_threshold: 2.0
    
    volatile:
      spread_mult: 1.1        # Wider spreads but still competitive
      alpha_mult: 1.5         # Trust alpha signals strongly
      gamma_mult: 1.2         # Slightly more risk aversion
      vol_threshold: 999.0    # Upper bound

  # Alpha Boost (Non-linear)
  alpha_boost:
    enabled: true
    extreme_threshold: 1.5    # MLOFI threshold for extreme boost
    extreme_mult: 2.0         # Multiplier for extreme imbalances
    high_threshold: 1.0       # MLOFI threshold for high boost
    high_mult: 1.5            # Multiplier for high imbalances

  # Asymmetric "Hunt" Logic
  hunt_logic:
    enabled: true
    bullish_threshold: 0.5    # Forecast threshold for bullish
    bearish_threshold: -0.5   # Forecast threshold for bearish
    bid_tighten_mult: 0.8    # Bid spread multiplier when bullish
    ask_widen_mult: 1.2      # Ask spread multiplier when bullish
    bid_widen_mult: 1.2      # Bid spread multiplier when bearish
    ask_tighten_mult: 0.8    # Ask spread multiplier when bearish

  # Slope Adjustment
  slope_adjustment:
    enabled: true
    min_mult: 0.8             # Minimum slope adjustment
    max_mult: 1.2             # Maximum slope adjustment

backtest:
  # Asset Configuration
  tick_size: 0.1
  lot_size: 0.001
  contract_size: 1.0
  
  # Latency
  order_latency_ns: 10_000_000  # 10ms order latency
  
  # Initial Capital
  initial_capital: 30000.0
  
  # Queue Model
  queue_model: "power_prob"   # power_prob, constant, etc.
  queue_model_param: 2.0      # Parameter for queue model
  
  # Exchange Settings
  partial_fill: false         # No partial fills

logging:
  level: "INFO"               # DEBUG, INFO, WARNING, ERROR
  file: "logs/backtest.log"   # Log file path (relative to project root)
  console: true               # Output to console
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

